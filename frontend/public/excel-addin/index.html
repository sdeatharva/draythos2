<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Draythos Finance Concept Translator</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; font-size: 13px; color: #1e293b; background: #f8fafc; }
    h2 { font-size: 15px; margin-top: 0; color: #0f172a; border-bottom: 1px solid #e2e8f0; padding-bottom: 8px; }
    .badge { display: inline-block; padding: 2px 6px; font-size: 10px; font-weight: 600; border-radius: 4px; background: #e0e7ff; color: #3730a3; margin-bottom: 12px; }
    .btn { display: block; width: 100%; padding: 8px 12px; margin-top: 8px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 500; cursor: pointer; text-align: center; }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary { background: #e2e8f0; color: #334155; }
    .btn-secondary:hover { background: #cbd5e1; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 12px; margin-bottom: 12px; }
    label { font-weight: 600; font-size: 11px; text-transform: uppercase; color: #64748b; }
    input, select { width: 100%; padding: 6px; margin: 4px 0 8px 0; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
    .caveat { font-size: 10px; color: #94a3b8; margin-top: 16px; font-style: italic; }
    #log { font-family: monospace; font-size: 11px; background: #0f172a; color: #38bdf8; padding: 8px; border-radius: 4px; max-height: 120px; overflow-y: auto; display: none; }
  </style>
</head>
<body>
  <h2>Draythos Translator</h2>
  <span class="badge">Model: enc-1.0.0 | Tax: tax-1.0.0</span>

  <div class="card">
    <label>1. Normalize Header Cells</label>
    <p style="margin: 4px 0 8px 0; color: #475569; font-size: 12px;">Select financial line item header cells in your sheet.</p>
    <button class="btn" id="btn-normalize">Normalize Selection</button>
  </div>

  <div class="card">
    <label>2. Pull Verified Fact</label>
    <select id="concept-select">
      <option value="fs.revenue">Revenue (fs.revenue)</option>
      <option value="fs.cogs">Cost of Goods Sold (fs.cogs)</option>
      <option value="fs.gross_profit">Gross Profit (fs.gross_profit)</option>
      <option value="fs.ebitda">EBITDA (fs.ebitda)</option>
      <option value="fs.pat">Net Profit / PAT (fs.pat)</option>
      <option value="tax.value_added">VAT / GST (tax.value_added)</option>
    </select>
    <input type="text" id="period-input" placeholder="Period (e.g., FY2024)" value="FY2024" />
    <button class="btn btn-secondary" id="btn-pull-fact">Insert Fact & Source</button>
  </div>

  <div class="card">
    <label>3. Deep-Link Source</label>
    <button class="btn btn-secondary" id="btn-open-source">Open Eyrie Canvas</button>
  </div>

  <div id="log"></div>

  <p class="caveat">Terminology normalization, not a legal determination.</p>

  <script src="taskpane.js"></script>
</body>
</html>
